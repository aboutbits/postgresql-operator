name: Tests

on:
  workflow_call:
    secrets:
      GRADLE_ENCRYPTION_KEY:
        required: false

env:
  # The workflows that call this one do not pass their env to it and set their own JAVA_VERSION: keep all equal.
  JAVA_VERSION: 25

permissions:
  contents: read

jobs:
  test:
    name: Tests (PostgreSQL ${{ matrix.postgres-version }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres-version: [ 15, 16, 17, 18 ]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: aboutbits/github-actions-java/setup-with-gradle@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build & Test
        run: >-
          ./gradlew
          --console=colored
          :operator:test
          --fail-fast
          -Dquarkus.test.profile=test-pg${{ matrix.postgres-version }}
