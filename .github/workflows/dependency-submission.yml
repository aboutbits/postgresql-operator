name: Dependency Submission

on:
  push:
    branches:
      - main
    # Every file that can change the resolved dependencies or the Gradle version, and this workflow. GitHub checks new
    # advisories against the last submitted dependency graph, so the workflow needs no run without such a change.
    # After a new release of the dependency-submission-with-gradle action, start the workflow by hand.
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/gradle.properties'
      - '**/*.versions.toml'
      - '**/*.lockfile'
      - 'buildSrc/**'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - '.github/workflows/dependency-submission.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: 25

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dependency-submission:
    name: Dependency Submission
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: aboutbits/github-actions-java/dependency-submission-with-gradle@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          project-type: quarkus
